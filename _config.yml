# Site settings
title: 김광현 포트폴리오
email: kyn06114@gmail.com
description: >-
  문제를 선제적으로 해결하는 개발자 김광현의 포트폴리오 및 기술 블로그입니다.
baseurl: ""
url: "https://kimgwang-hyeon.github.io"

# Author settings
author:
  name: 김광현
  github: kimgwang-hyeon
  email: kyn06114@gmail.com

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "김광현"
